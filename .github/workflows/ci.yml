name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin-web: ${{ steps.filter.outputs.admin-web }}
      pwa-patient: ${{ steps.filter.outputs.pwa-patient }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      telegram-bot: ${{ steps.filter.outputs.telegram-bot }}
      rag-agent: ${{ steps.filter.outputs.rag-agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin-web:
              - 'apps/admin-web/**'
            pwa-patient:
              - 'apps/pwa-patient/**'
            api-gateway:
              - 'services/api-gateway/**'
            telegram-bot:
              - 'services/telegram-bot/**'
            rag-agent:
              - 'services/rag-agent/**'

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin-web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pwa-patient:
    needs: changes
    if: needs.changes.outputs.pwa-patient == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa-patient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pwa-patient/package-lock.json
      - run: npm ci
      # tsc -b (type check) + vite build — mesmo comando usado no deploy da Vercel
      - run: npm run build

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Sem config de ESLint neste pacote ainda — build (tsc) já é o gate de tipos.
      - run: npm run build
      - run: npm test -- --passWithNoTests

  telegram-bot:
    needs: changes
    if: needs.changes.outputs.telegram-bot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/telegram-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rag-agent:
    needs: changes
    if: needs.changes.outputs.rag-agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/rag-agent/requirements.txt
      - run: pip install -r requirements.txt
      # Sem suíte de testes ainda — checagem de sintaxe/import estrutural do pacote.
      - run: python -m compileall -q app

  # Gate agregador: sempre roda e é o ÚNICO status check exigido pela proteção
  # da branch main. Falha se qualquer job necessário falhou/foi cancelado;
  # 'skipped' (pacote não alterado via paths-filter) é aceito. Evita o deadlock
  # de exigir jobs condicionais que nem sempre reportam.
  ci-success:
    needs: [changes, admin-web, pwa-patient, api-gateway, telegram-bot, rag-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultado dos jobs
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Resultados dos jobs: $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::Um ou mais jobs de CI falharam."
            exit 1
          fi
          echo "CI ok."
